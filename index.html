<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>貓燙員工系統</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#666;margin:0}
.boot{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px}
.spinner{width:40px;height:40px;border:3px solid #e5e5e5;border-top-color:#06C755;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<!--
  這是外殼頁面，幾乎不需要再更新。
  真正的畫面與功能都在 app.html 裡，每次都用當下時間戳記當參數去抓取，
  確保 LINE 的內建瀏覽器快取不會卡住舊版本，以後更新只需要換 app.html。
-->
<div class="boot" id="bootScreen">
  <div class="spinner"></div>
  <div style="font-size:14px">載入中...</div>
</div>
<script>
fetch('app.html?v=' + Date.now(), { cache: 'no-store' })
  .then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  })
  .then(function (html) {
    document.open();
    document.write(html);
    document.close();
  })
  .catch(function (e) {
    document.getElementById('bootScreen').innerHTML =
      '<div style="padding:24px;text-align:center;color:#c62828">載入失敗，請重新整理：' +
      (e && e.message ? e.message : e) + '</div>';
  });
</script>
</body>
</html>
