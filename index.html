<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>貓燙員工系統</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
  --green:#06C755; --bg:#f5f5f5; --card:#fff; --text:#1a1a1a;
  --sub:#666; --border:#e5e5e5; --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}
.header{background:var(--green);color:#fff;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.header-wrap{display:flex;align-items:center;gap:8px}
.back{background:none;border:none;color:#fff;font-size:26px;cursor:pointer;padding:0;line-height:1}
.header-title{font-size:18px;font-weight:600}
.header-sub{font-size:13px;opacity:.85;margin-top:2px}
.content{flex:1;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{display:block;width:100%;padding:14px;border-radius:var(--r);font-size:16px;font-weight:500;border:none;cursor:pointer;text-align:center;margin-top:8px}
.btn-primary{background:var(--green);color:#fff}
.btn-secondary{background:var(--border);color:var(--text)}
.btn:disabled{opacity:.4}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu-item{background:var(--card);border-radius:var(--r);padding:20px 12px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;border:1px solid var(--border)}
.menu-item.soon{opacity:.5}
.menu-icon{font-size:28px;margin-bottom:8px}
.menu-name{font-size:14px;font-weight:500}
.menu-sub{font-size:11px;color:var(--sub);margin-top:2px}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.form-group{margin-bottom:14px}
.label{font-size:13px;color:var(--sub);margin-bottom:5px;display:block}
.select{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:15px;background:var(--card);color:var(--text)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;margin:2px 1px}
.ok{background:#e6f7ed;color:#0a7a41}
.warn{background:#fff3e0;color:#e65100}
.blue{background:#e3f2fd;color:#1565c0}
.gray{background:var(--border);color:var(--sub)}
.list-item{padding:11px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.list-item:last-child{border-bottom:none}
.clock-display{font-size:52px;font-weight:200;text-align:center;margin:12px 0 4px;font-variant-numeric:tabular-nums}
.clock-date{text-align:center;color:var(--sub);font-size:14px;margin-bottom:14px}
.stat-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px}
.stat-val{font-weight:600}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.loc-status{font-size:13px;color:var(--sub);margin-bottom:12px;min-height:20px;text-align:center}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month-nav button{background:var(--card);border:1px solid var(--border);border-radius:8px;width:44px;height:36px;font-size:18px;cursor:pointer}
</style>
</head>
<body>

<!-- Loading -->
<div class="loading" id="sLoading">
  <div class="spinner"></div>
  <div style="font-size:14px;color:#666">載入中...</div>
</div>

<!-- Bind -->
<div class="screen" id="sBind">
  <div class="header"><div class="header-title">🐱 貓燙員工系統</div><div class="header-sub">首次使用請選擇您的姓名</div></div>
  <div class="content">
    <div class="card">
      <div class="form-group">
        <label class="label">選擇您的姓名</label>
        <select class="select" id="bindSel"><option value="">請選擇...</option></select>
      </div>
      <button class="btn btn-primary" id="btnBind" onclick="bindAccount()">確認綁定</button>
    </div>
    <div style="font-size:12px;color:#999;text-align:center;margin-top:8px">每個 LINE 帳號只能綁定一位員工，綁定後無法自行更改</div>
  </div>
</div>

<!-- Menu -->
<div class="screen" id="sMenu">
  <div class="header"><div class="header-title">🐱 貓燙員工系統</div><div class="header-sub" id="welcome">歡迎回來</div></div>
  <div class="content">
    <div class="menu-grid">
      <div class="menu-item" onclick="show('sClock')"><div class="menu-icon">👊</div><div class="menu-name">打卡</div><div class="menu-sub">上班 / 下班</div></div>
      <div class="menu-item" onclick="loadAttendance()"><div class="menu-icon">📊</div><div class="menu-name">我的出勤</div><div class="menu-sub">本月記錄</div></div>
      <div class="menu-item soon" onclick="soon()"><div class="menu-icon">📅</div><div class="menu-name">申請假期</div><div class="menu-sub">即將開放</div></div>
      <div class="menu-item soon" onclick="soon()"><div class="menu-icon">✏️</div><div class="menu-name">補打卡</div><div class="menu-sub">即將開放</div></div>
      <div class="menu-item soon" onclick="soon()"><div class="menu-icon">🎯</div><div class="menu-name">獎金進度</div><div class="menu-sub">即將開放</div></div>
      <div class="menu-item soon" onclick="soon()"><div class="menu-icon">💰</div><div class="menu-name">薪資單</div><div class="menu-sub">即將開放</div></div>
    </div>
  </div>
</div>

<!-- Clock -->
<div class="screen" id="sClock">
  <div class="header"><div class="header-wrap"><button class="back" onclick="show('sMenu')">‹</button><div class="header-title">打卡</div></div></div>
  <div class="content">
    <div class="card" style="text-align:center">
      <div class="clock-display" id="clockTime">--:--:--</div>
      <div class="clock-date" id="clockDate"></div>
      <div id="schedLine" style="font-size:14px;margin-bottom:10px;color:var(--sub)"></div>
      <div id="clockStatus" style="font-size:14px"></div>
    </div>
    <div class="loc-status" id="locStatus"></div>
    <button class="btn btn-primary" id="btnIn" onclick="doClock('in')" disabled>上班打卡</button>
    <button class="btn btn-secondary" id="btnOut" onclick="doClock('out')" disabled>下班打卡</button>
  </div>
</div>

<!-- Attendance -->
<div class="screen" id="sAtt">
  <div class="header"><div class="header-wrap"><button class="back" onclick="show('sMenu')">‹</button><div class="header-title">我的出勤</div></div></div>
  <div class="content">
    <div class="month-nav">
      <button onclick="shiftMonth(-1)">‹</button>
      <div id="attMonth" style="font-weight:600"></div>
      <button onclick="shiftMonth(1)">›</button>
    </div>
    <div id="attSummary" class="card"></div>
    <div id="attList" class="card"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div style="position:fixed;bottom:4px;right:8px;font-size:9px;color:#ccc;pointer-events:none">v2.0.0</div>

<script>
const LIFF_ID = '2011700774-SyRPvpY4';
// ↓↓↓ 部署新的 Apps Script 後，把「網路應用程式」網址貼在這裡 ↓↓↓
const API = 'https://script.google.com/macros/s/AKfycbxZH5DNK9AuH2HQNCY4PHAgPvqcH6NPimmIzI5Vad1lljNp6458cVaPKpPqz_8m4ynKNQ/exec';

let clockTimer = null, busy = false, attY = 0, attM = 0;

// ─ 工具 ─
function toast(msg, ms = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), ms);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function soon() { toast('這個功能即將開放'); }
function show(id) {
  document.getElementById('sLoading').style.display = 'none';
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
  if (id === 'sClock') startClock();
}
function fmt(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString('zh-TW', {hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Taipei'});
}
function taipeiToday() { return new Date().toLocaleDateString('sv-SE', {timeZone: 'Asia/Taipei'}); }

// 所有請求：附上 LIFF access token，由後端向 LINE 驗證身分
async function call(action, data = {}) {
  const token = liff.getAccessToken();
  if (!token) { liff.login(); throw new Error('登入中，請稍候...'); }
  let res;
  try {
    res = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=UTF-8'},   // 避免 CORS preflight
      body: JSON.stringify({action, accessToken: token, ...data})
    });
  } catch (e) { throw new Error('連線失敗，請檢查網路後再試'); }
  const r = await res.json();
  if (r.code === 'AUTH') { toast('登入已過期，重新登入中...'); setTimeout(() => { liff.logout(); liff.login(); }, 1200); }
  return r;
}

// ─ 初始化 ─
async function init() {
  try {
    if (API.indexOf('【') === 0) throw new Error('尚未設定 API 網址');
    await liff.init({liffId: LIFF_ID});
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const r = await call('getMe');
    if (r.error) throw new Error(r.error);
    if (r.bound) {
      document.getElementById('welcome').textContent = '歡迎回來，' + r.employee.name;
      show('sMenu');
    } else {
      const sel = document.getElementById('bindSel');
      (r.unboundList || []).forEach(n => {
        const o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o);
      });
      show('sBind');
    }
  } catch (e) {
    document.getElementById('sLoading').innerHTML =
      '<div style="padding:24px;color:#c62828;text-align:center">載入失敗：' + esc(e.message || e) + '</div>';
  }
}

// ─ 綁定 ─
async function bindAccount() {
  const name = document.getElementById('bindSel').value;
  if (!name) { toast('請選擇姓名'); return; }
  const btn = document.getElementById('btnBind');
  btn.disabled = true; btn.textContent = '綁定中，請稍候...';
  try {
    const r = await call('bindLine', {staffName: name});
    if (r.error) { toast('❌ ' + r.error, 4000); btn.disabled = false; btn.textContent = '確認綁定'; return; }
    document.getElementById('welcome').textContent = '歡迎回來，' + name;
    toast('✅ 綁定成功！');
    setTimeout(() => show('sMenu'), 1000);
  } catch (e) {
    toast('❌ ' + (e.message || e), 4000);
    btn.disabled = false; btn.textContent = '確認綁定';
  }
}

// ─ 打卡 ─
function startClock() {
  function tick() {
    const now = new Date();
    document.getElementById('clockTime').textContent =
      now.toLocaleTimeString('zh-TW', {hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Asia/Taipei'});
    document.getElementById('clockDate').textContent =
      now.toLocaleDateString('zh-TW', {year: 'numeric', month: 'long', day: 'numeric', weekday: 'short', timeZone: 'Asia/Taipei'});
  }
  tick(); clockTimer = setInterval(tick, 1000);
  document.getElementById('locStatus').textContent = '';
  loadClock();
}

const LEAVE_NAME = {'休': '休息日', '例': '例假', '特': '特休', '餘': '餘假', '事': '事假', '病': '病假', '颱': '颱風假'};
const SHIFT_NAME = {A: 'A 班', B: 'B 班', W: '工作室班'};

async function loadClock() {
  const sched = document.getElementById('schedLine'), st = document.getElementById('clockStatus');
  try {
    const r = await call('clockStatus');
    if (r.error) { st.innerHTML = '<span class="badge warn">' + esc(r.error) + '</span>'; return; }
    const s = r.schedule;
    if (!s) sched.textContent = '今日班表：未排班';
    else if (s.leave_code) sched.textContent = '今日班表：' + (LEAVE_NAME[s.leave_code] || s.leave_code);
    else sched.textContent = '今日班表：' + (SHIFT_NAME[s.shift_code] || s.shift_code) + ' ' + s.start + '–' + s.end + (s.position ? ' · ' + s.position : '');

    const recs = r.records || [];
    st.innerHTML = recs.length
      ? recs.map(x => '<span class="badge ' + (x.type === 'in' ? 'ok' : 'blue') + '">' + (x.type === 'in' ? '上班 ' : '下班 ') + fmt(x.time) + '</span>').join('')
        + (r.state === 'in' ? '<span class="badge warn">上班中</span>' : '')
      : '<span class="badge gray">今日尚未打卡</span>';
    applyButtons(r.state);
  } catch (e) { st.innerHTML = '<span class="badge warn">' + esc(e.message || e) + '</span>'; }
}

let lastState = null;
function applyButtons(state) {
  if (state) lastState = state;
  document.getElementById('btnIn').disabled = busy || lastState !== 'none' && lastState !== 'out';
  document.getElementById('btnOut').disabled = busy || lastState !== 'in';
}

function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('此裝置不支援定位'));
    navigator.geolocation.getCurrentPosition(res,
      e => rej(new Error(e.code === 1 ? '請允許 LINE 使用定位權限' : '無法取得定位，請到訊號較好的地方再試')),
      {enableHighAccuracy: true, timeout: 15000, maximumAge: 0});
  });
}

async function doClock(type) {
  if (busy) return;
  busy = true; applyButtons();
  const loc = document.getElementById('locStatus');
  try {
    loc.textContent = '📍 取得定位中...';
    const pos = await getPos();
    loc.textContent = '已取得定位，打卡中...';
    const r = await call(type === 'in' ? 'clockIn' : 'clockOut', {lat: pos.coords.latitude, lng: pos.coords.longitude});
    if (r.error) {
      loc.textContent = '❌ ' + r.error;
      toast('❌ ' + r.error, 4000);
    } else {
      loc.textContent = '✅ 打卡地點：' + r.location + '（' + r.distance + ' 公尺）';
      toast(type === 'in' ? '✅ 上班打卡成功！' : '✅ 下班打卡成功！');
    }
  } catch (e) {
    loc.textContent = '❌ ' + (e.message || e);
    toast('❌ ' + (e.message || e), 4000);
  }
  busy = false;
  await loadClock();
  applyButtons();
}

// ─ 我的出勤 ─
function loadAttendance() {
  const p = taipeiToday().split('-');
  attY = Number(p[0]); attM = Number(p[1]);
  show('sAtt');
  renderAtt();
}
function shiftMonth(d) {
  attM += d;
  if (attM < 1) { attM = 12; attY--; }
  if (attM > 12) { attM = 1; attY++; }
  renderAtt();
}
async function renderAtt() {
  document.getElementById('attMonth').textContent = attY + ' 年 ' + attM + ' 月';
  const sum = document.getElementById('attSummary'), list = document.getElementById('attList');
  sum.innerHTML = '<div style="text-align:center"><div class="spinner" style="margin:8px auto"></div></div>';
  list.innerHTML = '';
  try {
    const r = await call('getAttendance', {year: attY, month: attM});
    if (r.error) { sum.textContent = r.error; return; }
    const today = r.today, byDate = {};
    (r.records || []).forEach(x => { (byDate[x.work_date] = byDate[x.work_date] || []).push(x); });

    const wk = ['日', '一', '二', '三', '四', '五', '六'];
    let total = 0, rows = [];
    Object.keys(byDate).sort().reverse().forEach(d => {
      let open = null, h = 0, segs = [];
      byDate[d].forEach(x => {
        if (x.punch_type === 'in') { if (open) segs.push({a: open, b: null}); open = x.punch_time; }
        else if (open) { segs.push({a: open, b: x.punch_time}); h += (new Date(x.punch_time) - new Date(open)) / 36e5; open = null; }
      });
      if (open) segs.push({a: open, b: null});
      total += h;
      const dangling = segs.some(s => !s.b);
      const tag = dangling ? (d === today ? '<span class="badge blue">上班中</span>' : '<span class="badge warn">未下班</span>')
                           : '<span class="badge ok">✓ ' + h.toFixed(1) + 'h</span>';
      const dow = wk[new Date(d + 'T12:00:00+08:00').getDay()];
      rows.push('<div class="list-item"><div><div style="font-size:13px;font-weight:500">' + esc(d.slice(5)) +
        ' <span style="font-size:11px;color:#999">週' + dow + '</span></div>' +
        '<div style="font-size:12px;color:#666">' + segs.map(s => fmt(s.a) + '–' + (s.b ? fmt(s.b) : '未下班')).join('、') +
        '</div></div>' + tag + '</div>');
    });
    sum.innerHTML = '<div class="stat-row"><span>出勤天數</span><span class="stat-val">' + Object.keys(byDate).length + ' 天</span></div>' +
      '<div class="stat-row"><span>打卡總時數</span><span class="stat-val">' + total.toFixed(1) + ' h</span></div>' +
      '<div style="font-size:11px;color:#999">時數為打卡上下班時間相加，尚未扣除休息時間，實際以薪資單為準</div>';
    list.innerHTML = rows.length ? rows.join('') : '<div style="text-align:center;color:#999;padding:12px">這個月沒有打卡紀錄</div>';
  } catch (e) { sum.textContent = e.message || e; }
}

init();
</script>
</body>
</html>
