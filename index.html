<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>貓燙員工系統</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
  --green:#06C755; --bg:#f5f5f5; --card:#fff; --text:#1a1a1a;
  --sub:#666; --border:#e5e5e5; --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}
.header{background:var(--green);color:#fff;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.header-wrap{display:flex;align-items:center;gap:8px}
.back{background:none;border:none;color:#fff;font-size:26px;cursor:pointer;padding:0;line-height:1}
.header-title{font-size:18px;font-weight:600}
.header-sub{font-size:13px;opacity:.85;margin-top:2px}
.content{flex:1;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{display:block;width:100%;padding:14px;border-radius:var(--r);font-size:16px;font-weight:500;border:none;cursor:pointer;text-align:center;margin-top:8px}
.btn:first-of-type{margin-top:0}
.btn-primary{background:var(--green);color:#fff}
.btn-secondary{background:var(--border);color:var(--text)}
.btn:disabled{opacity:.5}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu-item{background:var(--card);border-radius:var(--r);padding:20px 12px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;border:1px solid var(--border)}
.menu-icon{font-size:28px;margin-bottom:8px}
.menu-name{font-size:14px;font-weight:500}
.menu-sub{font-size:11px;color:var(--sub);margin-top:2px}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.form-group{margin-bottom:14px}
.label{font-size:13px;color:var(--sub);margin-bottom:5px;display:block}
.input,.select{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:15px;background:var(--card);color:var(--text)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500}
.ok{background:#e6f7ed;color:#0a7a41}
.warn{background:#fff3e0;color:#e65100}
.err{background:#ffebee;color:#c62828}
.blue{background:#e3f2fd;color:#1565c0}
.gray{background:var(--border);color:var(--sub)}
.progress-bar{background:var(--border);border-radius:99px;height:10px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.list-item{padding:11px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.list-item:last-child{border-bottom:none}
.clock-display{font-size:52px;font-weight:200;text-align:center;margin:20px 0 4px;font-variant-numeric:tabular-nums}
.clock-date{text-align:center;color:var(--sub);font-size:14px;margin-bottom:20px}
.stat-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px}
.stat-val{font-weight:600}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw}
.toast.show{opacity:1}
.loc-status{font-size:13px;color:var(--sub);margin-bottom:12px;min-height:20px;text-align:center}
</style>
</head>
<body>

<!-- Loading -->
<div class="loading" id="sLoading">
  <div class="spinner"></div>
  <div style="font-size:14px;color:#666">載入中...</div>
</div>

<!-- Bind -->
<div class="screen" id="sBind">
  <div class="header"><div class="header-title">🐱 貓燙員工系統</div><div class="header-sub">首次使用請選擇您的姓名</div></div>
  <div class="content">
    <div class="card">
      <div class="form-group">
        <label class="label">選擇您的姓名</label>
        <select class="select" id="bindSel"><option value="">請選擇...</option></select>
      </div>
      <button class="btn btn-primary" onclick="bindAccount()">確認綁定</button>
    </div>
    <div style="font-size:12px;color:#999;text-align:center;margin-top:8px">每個 LINE 帳號只能綁定一位員工</div>
  </div>
</div>

<!-- Menu -->
<div class="screen" id="sMenu">
  <div class="header"><div class="header-title">🐱 貓燙員工系統</div><div class="header-sub" id="welcome">歡迎回來</div></div>
  <div class="content">
    <div class="menu-grid">
      <div class="menu-item" onclick="show('sClock')"><div class="menu-icon">👊</div><div class="menu-name">打卡</div><div class="menu-sub">上班 / 下班</div></div>
      <div class="menu-item" onclick="show('sLeave')"><div class="menu-icon">📅</div><div class="menu-name">申請假期</div><div class="menu-sub">病假/事假/特休</div></div>
      <div class="menu-item" onclick="show('sMakeup')"><div class="menu-icon">✏️</div><div class="menu-name">補打卡</div><div class="menu-sub">忘記打卡補申請</div></div>
      <div class="menu-item" onclick="loadAttendance()"><div class="menu-icon">📊</div><div class="menu-name">我的出勤</div><div class="menu-sub">本月記錄</div></div>
      <div class="menu-item" onclick="loadBonus()"><div class="menu-icon">🎯</div><div class="menu-name">獎金進度</div><div class="menu-sub">當月營業額</div></div>
      <div class="menu-item" onclick="loadPayslip()"><div class="menu-icon">💰</div><div class="menu-name">薪資單</div><div class="menu-sub">查看確認</div></div>
    </div>
  </div>
</div>

<!-- Clock -->
<div class="screen" id="sClock">
  <div class="header"><div class="header-wrap"><button class="back" onclick="show('sMenu')">‹</button><div><div class="header-title">打卡</div></div></div></div>
  <div class="content">
    <div class="card" style="text-align:center">
      <div class="clock-display" id="clockTime">--:--</div>
      <div class="clock-date" id="clockDate"></div>
      <div id="clockStatus" style="margin-bottom:12px;font-size:14px"></div>
    </div>
    <div class="loc-status" id="locStatus"></div>
    <button class="btn btn-primary" id="btnIn" onclick="doClock('in')">上班打卡</button>
    <button class="btn btn-secondary" id="btnOut" onclick="doClock('out')" style="margin-top:8px">下班打卡</button>
  </div>
</div>

<!-- Leave -->
<div class="screen" id="sLeave">
  <div class="header"><div class="header-wrap"><button class="back" onclick="show('sMenu')">‹</button><div class="header-title">申請假期</div></div></div>
  <div class="content">
    <div class="card">
      <div class="form-group"><label class="label">假別</label>
        <select class="select" id="lvType"><option value="sick">病假（半薪）</option><option value="personal">事假（不計薪）</option><option value="annual">特休（全薪）</option></select></div>
      <div class="form-group"><label class="label">日期</label><input type="date" class="input" id="lvDate"></div>
      <div class="form-group"><label class="label">整天或部分</label>
        <select class="select" id="lvFull" onchange="toggleLvTime()"><option value="true">整天</option><option value="false">部分時段</option></select></div>
      <div id="lvTimeBox" style="display:none">
        <div class="form-group"><label class="label">開始時間</label><input type="time" class="input" id="lvStart"></div>
        <div class="form-group"><label class="label">結束時間</label><input type="time" class="input" id="lvEnd"></div>
      </div>
      <div class="form-group"><label class="label">備註（選填）</label><input type="text" class="input" id="lvNote" placeholder="例：看診"></div>
      <button class="btn btn-primary" onclick="submitLeave()">送出申請</button>
    </div>
  </div>
</div>

<!-- Makeup -->
<div class="screen" id="sMakeup">
  <div class="header"><div class="header-wrap"><button class="back" onclick="show('sMenu')">‹</button><div class="header-title">補打卡申請</div></div></div>
  <div class="content">
    <div class="card">
      <div class="form-group"><label class="label">日期</label><input type="date" class="input" id="mkDate"></div>
      <div class="form-group"><label class="label">補打上班時間（如有）</label><input type="time" class="input" id="mkIn"></div>
      <div class="form-group"><label class="label">補打下班時間（如有）</label><input type="time" class="input" id="mkOut"></div>
      <div class="form-group"><label class="label">原因</label><input type="text" class="input" id="mkNote" placeholder="例：忘記打下班卡"></div>
      <button class="btn btn-primary" onclick="submitMakeup()">送出申請</button>
    </div>
  </div>
</div>

<!-- Attendance -->
<div class="screen" id="sAtt">
  <div class="header"><div class="header-wrap"><button class="back" onclick="show('sMenu')">‹</button><div class="header-title">我的出勤</div></div></div>
  <div class="content"><div id="attSummary" class="card"></div><div id="attList" class="card"></div></div>
</div>

<!-- Bonus -->
<div class="screen" id="sBonus">
  <div class="header"><div class="header-wrap"><button class="back" onclick="show('sMenu')">‹</button><div class="header-title">獎金進度</div></div></div>
  <div class="content"><div id="bonusContent"></div></div>
</div>

<!-- Payslip -->
<div class="screen" id="sPayslip">
  <div class="header"><div class="header-wrap"><button class="back" onclick="show('sMenu')">‹</button><div class="header-title">薪資單</div></div></div>
  <div class="content"><div id="payslipContent"></div></div>
</div>

<div class="toast" id="toast"></div>
<div style="position:fixed;bottom:4px;right:8px;font-size:9px;color:#ccc;pointer-events:none">v1.2.0</div>

<script>
const LIFF_ID  = '2011700774-SyRPvpY4';
const API      = 'https://script.google.com/macros/s/AKfycbyd2oaMgRhBE6vn3odQO08Z2_AS2S3_mpAEM7FnZiODz2Gfo8fsAJADl4EiF4srCLD6_A/exec';
const SHOP_LAT   = 24.154860099664177;
const SHOP_LNG   = 120.62954818465384;
const STUDIO_LAT = 24.134449838402418;
const STUDIO_LNG = 120.66357352008747;
const MAX_DIST   = 500;
const LOCATIONS  = [
  { name:'黎明',   lat:24.154860099664177, lng:120.62954818465384 },
  { name:'工作室', lat:24.134449838402418, lng:120.66357352008747 },
];

let lineUserId = null, clockTimer = null;

// ─ Utilities ─
function toast(msg, ms=2500) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), ms);
}
function show(id) {
  document.getElementById('sLoading').style.display = 'none';
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (clockTimer) { clearInterval(clockTimer); clockTimer=null; }
  if (id==='sClock') startClock();
}
async function api(action, params={}) {
  const q = new URLSearchParams({action, lineUserId, ...params});
  return fetch(API+'?'+q).then(r=>r.json());
}
async function post(action, data={}) {
  // 用 text/plain 避免 CORS preflight，Apps Script 仍可正常解析 JSON
  return fetch(API, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=UTF-8'},
    body: JSON.stringify({action, lineUserId, ...data})
  }).then(r => r.json());
}
function fmt(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false});
}
function todayStr() { return new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'}); }

// ─ Geolocation ─
function dist(la1,lo1,la2,lo2){
  const R=6371000,dl=(la2-la1)*Math.PI/180,dg=(lo2-lo1)*Math.PI/180;
  return R*2*Math.asin(Math.sqrt(Math.sin(dl/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dg/2)**2));
}
function detectLocation(lat, lng) {
  for (const loc of LOCATIONS) {
    const d = Math.round(dist(lat, lng, loc.lat, loc.lng));
    if (d <= MAX_DIST) return { location: loc.name, distance: d };
  }
  const dists = LOCATIONS.map(l=>({ name:l.name, d:Math.round(dist(lat,lng,l.lat,l.lng)) }));
  return { location: null, dists };
}
function checkLoc() {
  return new Promise((res,rej)=>{
    const el=document.getElementById('locStatus');
    if (!navigator.geolocation){rej('瀏覽器不支援定位');return;}
    el.textContent='📍 取得定位中...';
    navigator.geolocation.getCurrentPosition(
      p=>{
        const result = detectLocation(p.coords.latitude, p.coords.longitude);
        if (result.location) {
          el.textContent='✅ 打卡地點：'+result.location+'（'+result.distance+' 公尺）';
          res(result.location);
        } else {
          const info = result.dists.map(x=>'距'+x.name+' '+x.d+'m').join('、');
          el.textContent='❌ 不在打卡範圍內（'+info+'，需在 '+MAX_DIST+' 公尺內）';
          rej('不在打卡範圍內：'+info);
        }
      },
      e=>{el.textContent='⚠️ 無法取得定位，請允許定位權限';rej('定位失敗');},
      {timeout:10000,maximumAge:60000,enableHighAccuracy:true}
    );
  });
}

// ─ Init ─
async function init() {
  try {
    await liff.init({liffId: LIFF_ID});
    if (!liff.isLoggedIn()) { liff.login(); return; }
    lineUserId = (await liff.getProfile()).userId;
    const r = await api('getStaff');
    if (r.bound) {
      document.getElementById('welcome').textContent = '歡迎回來，' + r.staff.name;
      show('sMenu');
    } else {
      const sel = document.getElementById('bindSel');
      (r.staffList||[]).forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o);});
      show('sBind');
    }
  } catch(e) {
    document.getElementById('sLoading').innerHTML='<div style="padding:24px;color:red;text-align:center">載入失敗：'+e+'</div>';
  }
}

// ─ Bind ─
async function bindAccount() {
  const name = document.getElementById('bindSel').value;
  if (!name) { toast('請選擇姓名'); return; }
  const btn = document.querySelector('#sBind .btn-primary');
  btn.disabled = true; btn.textContent = '綁定中，請稍候...';
  try {
    const r = await post('bindLine',{staffName:name});
    if (r.error) {
      toast('❌ '+r.error);
      btn.disabled=false; btn.textContent='確認綁定';
      return;
    }
    document.getElementById('welcome').textContent = '歡迎回來，'+name;
    toast('✅ 綁定成功！');
    setTimeout(()=>show('sMenu'), 1200);
  } catch(e) {
    toast('❌ 連線失敗，請稍後再試：'+e);
    btn.disabled=false; btn.textContent='確認綁定';
  }
}

// ─ Clock ─
function startClock() {
  function tick() {
    const now = new Date();
    document.getElementById('clockTime').textContent =
      now.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Taipei'});
    document.getElementById('clockDate').textContent =
      now.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'short',timeZone:'Asia/Taipei'});
  }
  tick(); clockTimer = setInterval(tick,1000);
  loadClockStatus();
}
async function loadClockStatus() {
  const now=new Date(), r=await api('getAttendance',{year:now.getFullYear(),month:now.getMonth()+1});
  const today=todayStr(), a=(r.attendance||[]).find(x=>x.date===today);
  const el=document.getElementById('clockStatus');
  if (!a) el.innerHTML='<span class="badge gray">今日尚未打卡</span>';
  else {
    const loc = a.location ? ' <span class="badge blue">📍'+a.location+'</span>' : '';
    if (a.clock_in && !a.clock_out) el.innerHTML='<span class="badge ok">上班 '+fmt(a.clock_in)+'</span>'+loc+' <span class="badge warn">未打下班卡</span>';
    else if (a.clock_in && a.clock_out) el.innerHTML='<span class="badge ok">上班 '+fmt(a.clock_in)+'</span> <span class="badge ok">下班 '+fmt(a.clock_out)+'</span>'+loc;
  }
}
async function doClock(type) {
  const btn=document.getElementById(type==='in'?'btnIn':'btnOut');
  btn.disabled=true; btn.textContent='定位確認中...';
  try {
    const currentLocation = await checkLoc();
    btn.textContent='打卡中...';
    const r = await post(type==='in'?'clockIn':'clockOut',{timestamp:new Date().toISOString(),location:currentLocation});
    if (r.error) { toast('❌ '+r.error); }
    else { toast(type==='in'?'✅ 上班打卡成功！':'✅ 下班打卡成功！'); loadClockStatus(); }
  } catch(e) { toast('❌ '+e); }
  btn.disabled=false; btn.textContent=type==='in'?'上班打卡':'下班打卡';
}

// ─ Leave ─
function toggleLvTime() {
  document.getElementById('lvTimeBox').style.display=document.getElementById('lvFull').value==='false'?'block':'none';
}
async function submitLeave() {
  const date=document.getElementById('lvDate').value;
  if (!date){toast('請選擇日期');return;}
  const full=document.getElementById('lvFull').value==='true';
  const s=document.getElementById('lvStart').value, e=document.getElementById('lvEnd').value;
  let hours=null;
  if(!full&&s&&e){const[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);hours=Math.round(((eh*60+em)-(sh*60+sm))/6)/10;}
  const r=await post('leaveRequest',{date,leaveType:document.getElementById('lvType').value,
    isFullDay:full,startTime:full?null:s,endTime:full?null:e,hours,note:document.getElementById('lvNote').value||null});
  if(r.error){toast('❌ '+r.error);return;}
  toast('✅ 請假申請已送出，等待審核');
  setTimeout(()=>show('sMenu'),1500);
}

// ─ Makeup ─
async function submitMakeup() {
  const date=document.getElementById('mkDate').value;
  if(!date){toast('請選擇日期');return;}
  const r=await post('makeupPunch',{date,clockIn:document.getElementById('mkIn').value||null,
    clockOut:document.getElementById('mkOut').value||null,note:document.getElementById('mkNote').value||null});
  if(r.error){toast('❌ '+r.error);return;}
  toast('✅ 補打卡申請已送出，等待審核');
  setTimeout(()=>show('sMenu'),1500);
}

// ─ Attendance ─
async function loadAttendance() {
  show('sAtt');
  const now=new Date(), r=await api('getAttendance',{year:now.getFullYear(),month:now.getMonth()+1});
  const atts=r.attendance||[], leaves=r.leaves||[];
  let hrs=0, sickH=0, perH=0, annD=0;
  atts.forEach(a=>{if(a.clock_in&&a.clock_out&&a.status!=='rejected')hrs+=Math.min((new Date(a.clock_out)-new Date(a.clock_in))/3600000,9);});
  leaves.filter(l=>l.status==='approved').forEach(l=>{
    if(l.leave_type==='sick')sickH+=l.hours||8.5;
    else if(l.leave_type==='personal')perH+=l.hours||8.5;
    else if(l.leave_type==='annual')annD++;
  });
  document.getElementById('attSummary').innerHTML=
    `<div class="stat-row"><span>實際出勤時數</span><span class="stat-val">${hrs.toFixed(1)} h</span></div>
     <div class="stat-row"><span>病假</span><span class="stat-val">${sickH.toFixed(1)} h</span></div>
     <div class="stat-row"><span>事假</span><span class="stat-val">${perH.toFixed(1)} h</span></div>
     <div class="stat-row"><span>特休</span><span class="stat-val">${annD} 天</span></div>`;
  const dates=[...new Set([...atts.map(a=>a.date),...leaves.map(l=>l.date)])].sort().reverse();
  const weekDays=['日','一','二','三','四','五','六'];
  document.getElementById('attList').innerHTML=dates.slice(0,31).map(d=>{
    const a=atts.find(x=>x.date===d), ls=leaves.filter(x=>x.date===d&&x.status==='approved');
    const ltag=ls.map(l=>({sick:'病假',personal:'事假',annual:'特休'}[l.leave_type])).join('、');
    const stag=a?.status==='pending'?'<span class="badge gray">補打待審</span>':'';
    const rtag=a?.clock_in&&a?.clock_out?'<span class="badge ok">✓</span>':a?.clock_in?'<span class="badge warn">未下班</span>':ltag?'<span class="badge blue">'+ltag+'</span>':'<span class="badge gray">—</span>';
    const dow = weekDays[new Date(d+'T12:00:00+08:00').getDay()];
    const locTag = a?.location ? ' <span style="font-size:10px;color:#1565c0">📍'+a.location+'</span>' : '';
    return `<div class="list-item"><div>
      <div style="font-size:13px;font-weight:500">${d.slice(5)} <span style="font-size:11px;color:#999">週${dow}</span></div>
      <div style="font-size:12px;color:#666">${a?fmt(a.clock_in)+'–'+fmt(a.clock_out):''}${locTag} ${ltag} ${stag}</div>
      </div>${rtag}</div>`;
  }).join('');
}

// ─ Bonus ─
async function loadBonus() {
  show('sBonus');
  document.getElementById('bonusContent').innerHTML='<div class="card" style="text-align:center;padding:32px"><div class="spinner"></div></div>';
  const now=new Date(), r=await api('getBonusProgress',{year:now.getFullYear(),month:now.getMonth()+1});
  if(r.error){document.getElementById('bonusContent').innerHTML='<div class="card">'+r.error+'</div>';return;}
  const pct=r.nextTierThreshold>0?Math.min(100,r.totalRevenue/r.nextTierThreshold*100).toFixed(1):100;
  const mn=['一','二','三','四','五','六','七','八','九','十','十一','十二'][now.getMonth()];
  document.getElementById('bonusContent').innerHTML=
    `<div class="card"><div style="font-size:13px;color:#666;margin-bottom:4px">${mn}月營業額</div>
     <div style="font-size:32px;font-weight:600">NT$ ${r.totalRevenue.toLocaleString()}</div>
     <div style="font-size:13px;color:#666;margin-top:4px">全員出勤總時數 ${r.totalHours} 小時</div></div>
     <div class="card"><div style="font-size:13px;color:#666;margin-bottom:8px">達標獎金進度</div>
     ${r.bonusTier>0?`<div style="font-size:24px;font-weight:600;color:var(--green);margin-bottom:6px">NT$ ${r.bonusAmount.toLocaleString()}</div>
     <div style="font-size:13px;margin-bottom:8px">已達第 ${r.bonusTier} 級</div>`:`<div style="font-size:16px;color:#999;margin-bottom:8px">尚未達標</div>`}
     ${r.gap>0?`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
     <div style="font-size:12px;color:#666;margin-top:4px">距下一級還差 NT$ ${r.gap.toLocaleString()}</div>`:`<div style="color:var(--green);font-size:12px">已達最高級！</div>`}</div>
     <div class="card"><div style="font-size:12px;color:#999">獎金適用正職員工（曾佳慈、許倢瑄、張意珊）</div></div>`;
}

// ─ Payslip ─
async function loadPayslip() {
  show('sPayslip');
  document.getElementById('payslipContent').innerHTML='<div class="card" style="text-align:center;padding:32px"><div class="spinner"></div></div>';
  const now=new Date(), y=now.getFullYear(), m=now.getMonth()+1;
  const r=await api('getPayslip',{year:y,month:m});
  if(!r?.payslip){
    document.getElementById('payslipContent').innerHTML='<div class="card" style="text-align:center;padding:24px;color:#999">本月薪資單尚未出爐</div>';
    return;
  }
  const p=r.payslip;
  document.getElementById('payslipContent').innerHTML=
    `<div class="card">
     <div style="font-size:13px;color:#666;margin-bottom:4px">${y}年${m}月薪資單</div>
     <div class="list-item"><span>底薪</span><span class="stat-val">NT$ ${(p.base_salary||0).toLocaleString()}</span></div>
     ${p.sick_leave_deduction?`<div class="list-item"><span>病假扣款</span><span style="color:#c62828">- NT$ ${p.sick_leave_deduction.toLocaleString()}</span></div>`:''}
     ${p.personal_leave_deduction?`<div class="list-item"><span>事假扣款</span><span style="color:#c62828">- NT$ ${p.personal_leave_deduction.toLocaleString()}</span></div>`:''}
     ${p.achievement_bonus?`<div class="list-item"><span>達標獎金</span><span style="color:var(--green)">+ NT$ ${p.achievement_bonus.toLocaleString()}</span></div>`:''}
     <div class="list-item" style="font-size:18px;font-weight:600"><span>實領薪資</span><span style="color:var(--green)">NT$ ${(p.total_salary||0).toLocaleString()}</span></div>
     </div>
     ${p.status==='sent'?`<div class="card">
       <div style="font-size:13px;color:#666;margin-bottom:10px">請確認薪資明細是否正確</div>
       <button class="btn btn-primary" onclick="confirmSlip(${y},${m})">✓ 確認無誤</button>
       <button class="btn btn-secondary" onclick="toast('請直接聯繫老闆說明問題')">有問題</button>
     </div>`:''}
     ${p.status==='confirmed'?`<div class="card" style="text-align:center;color:var(--green);font-weight:500">✅ 已確認</div>`:''}`;
}
async function confirmSlip(y,m) {
  const r=await post('confirmPayslip',{year:y,month:m});
  if(r.error){toast('❌ '+r.error);return;}
  toast('✅ 薪資單已確認'); setTimeout(()=>loadPayslip(),1500);
}

// ─ Defaults ─
document.getElementById('lvDate').value = todayStr();
document.getElementById('mkDate').value = todayStr();
init();
</script>
